services:
  app:
    build: .
    image: ppaip-landing
    restart: unless-stopped
    ports:
      - "${DOCKER_APP_PORT:-8088}:8080"
    environment:
      APP_NAME: "PPAIP Universitas Bakrie"
      APP_KEY: ${APP_KEY:?Set APP_KEY in .env (php artisan key:generate)}
      APP_URL: ${DOCKER_APP_URL:-http://localhost:8088}
      APP_LOCALE: id
      APP_FALLBACK_LOCALE: en
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ppaip
      DB_USERNAME: ppaip
      DB_PASSWORD: ${DOCKER_DB_PASSWORD:-ppaip}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
      FILESYSTEM_DISK: local
      MAIL_MAILER: log
      ADMIN_NAME: ${ADMIN_NAME:-PPAIP Admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - storage-public:/app/storage/app/public
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ppaip
      MYSQL_USER: ppaip
      MYSQL_PASSWORD: ${DOCKER_DB_PASSWORD:-ppaip}
      MYSQL_ROOT_PASSWORD: ${DOCKER_DB_ROOT_PASSWORD:-root}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # TCP ping so the temporary init server (socket-only) is not reported healthy.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  mysql-data:
  storage-public:
